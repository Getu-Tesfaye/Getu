<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birr Watch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Birr Watch</h1>
    <div id="status"></div>

    <div id="app" style="display: none;">
      <section class="card">
        <h2>Converter</h2>
        <div class="form-group">
          <input type="number" id="etbAmount" placeholder="Amount in ETB" min="0" step="any" />
          <select id="currencySelect"></select>
          <button id="convertBtn">Convert</button>
        </div>
        <p id="conversionResult"></p>
        <button id="addToWatchlistBtn">Add to Watchlist</button>
      </section>

      <section class="card">
        <h2>Watchlist</h2>
        <ul id="watchlist"></ul>
      </section>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
