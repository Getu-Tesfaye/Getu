<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Addis Market Shopping </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    
<div id="loginPage" class="login-container">

    <div class="login-box">

        <h1>🏪 Addis Market</h1>
        <p>(አዲስ ገበያ)</p>

        <h2>Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
        >

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >

        <button id="loginButton"></button>

        <p id="loginError"></p>

    </div>

</div>

    
    <div class="container">

        <h1> 🛍️ Addis Market <span>(አዲስ ገበያ)</span></h1>

          <p class="subtitle">Welcome to Addis Shopping 🛍️</p>

        

        <form id="form">
            <label for="name">Item Name</label>

            <input
                type="text"
                id="name"
                placeholder="laptop"
            >

            <label for="price">Price (ETB)</label>

            <input
                type="number"
                id="price"
                placeholder="80000"
             >   
            <button class="add-button" type="submit"></button>

        </form>


        <p id="error"></p>

        <h2>Shopping Items</h2>
        <ul id="list"></ul>




        <div class="total-box">

            <span>Total:</span>

            <strong>
                <span id="total">0.00</span> ETB
            </strong>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
