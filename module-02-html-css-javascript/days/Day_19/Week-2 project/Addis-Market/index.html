<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Addis Market</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <!-- Header Section -->
    <header class="card-header">
      <div class="logo-icon"></div>
      <h1>Addis market</h1>
      <p class="subtitle">addis market shopping list & Task Manager</p>
    </header>

    <!-- Input Form Section -->
    <form id="item-form" class="form-container">
      <div class="form-row">
        <div class="form-group">
          <label for="item-name">Item Name</label>
          <input type="text" id="item-name" placeholder="e.g., HP Laptop" required />
        </div>
        <div class="form-group">
          <label for="item-price">Price (ETB)</label>
          <input type="number" id="item-price" placeholder="0.00" min="0" step="any" required />
        </div>
      </div>

      <div class="form-group">
        <label for="item-category">Category</label>
        <select id="item-category">
          <option value="Laptops">📱 Laptops</option>
          <option value="Smartphones">📱 Smartphones</option>
          <option value="Accessories">🔌 Accessories</option>
        </select>
      </div>

      <button type="submit" class="btn-add">Add Market Item</button>
    </form>

    
    <ul id="item-list" class="item-list"></ul>

  
    <footer class="card-footer">
      <span id="remaining-count" class="badge">0 remaining</span>
      <span id="total-price" class="total-price">Total: 0 ETB</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
