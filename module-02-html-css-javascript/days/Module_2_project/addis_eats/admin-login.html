<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Addis Eats</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">
  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <span class="login-logo" aria-hidden="true">🍽️</span>
        <h1>Addis Eats Admin</h1>
        <p>Sign in to manage dishes and orders</p>
      </div>

      <div id="login-error" class="alert alert-error" role="alert" hidden></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="getu">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="getu4321">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <a href="index.html" class="back-link">&larr; Back to customer site</a>
    </div>
  </main>
  <script src="admin-login.js"></script>
</body>
</html>
