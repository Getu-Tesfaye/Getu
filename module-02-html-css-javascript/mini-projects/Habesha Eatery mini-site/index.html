<!DOCTYPE html>
<html lang="en">
<head>
    <title>Habesha Eatery - Home</title>
</head>
<body>

    <!-- Shared Navigation Bar -->
    <nav>
        <a href="index.html">Home</a> | 
        <a href="contact.html">Contact</a>
    </nav>

    <h1>Habesha Eatery</h1>

    <!-- 1. Reservation Form -->
    <form>
        <h3>Book a Table</h3>
        <label for="date">Date:</label>
        <input type="date" id="date" required><br><br>

        <label for="time">Time:</label>
        <input type="time" id="time" required><br><br>

        <button type="submit">Book Now</button>
    </form>

    <!-- 2. ETB Menu Table -->
    <h3>Our Menu</h3>
    <table border="1">
        <tr>
            <th>Dish</th>
            <th>Price (ETB)</th>
        </tr>
        <tr>
            <td>Doro Wat</td>
            <td>500 ETB</td>
        </tr>
        <tr>
            <td>Kitfo</td>
            <td>450 ETB</td>
        </tr>
    </table>

    <!-- 3. Media Block -->
    <h3>Our Restaurant</h3>
    <figure>
        <img src="https://ethiopianrestaurants.wordpress.com" alt= "ethiopian traditional food">
        <figcaption>Freshly prepared Ethiopian traditional food.</figcaption>
    </figure>

</body>
</html>
