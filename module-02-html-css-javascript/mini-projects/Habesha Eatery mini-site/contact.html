<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with Habesha Eatery or view our weekly opening hours.">
  <title>Habesha Eatery - Contact & Hours</title>
</head>
<body>

  <header>
    <h1>Contact Habesha Eatery</h1>
    <nav>
      <a href="index.html">Home</a> | 
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
    <!-- Contact Form -->
    <section>
      <h2>Send Us a Message</h2>
      <form action="#" method="POST">
        <p>
          <label for="c-name">Name:</label><br>
          <input type="text" id="c-name" name="name" required>
        </p>
        <p>
          <label for="c-email">Email:</label><br>
          <input type="email" id="c-email" name="email" required>
        </p>
        <p>
          <label for="c-msg">Message:</label><br>
          <textarea id="c-msg" name="message" rows="4" required></textarea>
        </p>
        <button type="submit">Send Message</button>
      </form>
    </section>

    <!-- Opening Hours Table -->
    <section>
      <h2>Opening Hours</h2>
      <table>
        <caption>Weekly Operating Hours</caption>
        <thead>
          <tr>
            <th scope="col">Day</th>
            <th scope="col">Hours</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Monday - Friday</td>
            <td>8:00 AM - 10:00 PM</td>
          </tr>
          <tr>
            <td>Saturday - Sunday</td>
            <td>9:00 AM - 11:00 PM</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

</body>
</html>
