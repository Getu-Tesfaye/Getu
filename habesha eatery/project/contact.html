<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Habesha Eatery</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <a href="index.html" class="logo">Habesha Eatery</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="menu.html">Menu</a>
      <a href="about.html">About US</a>
      <a href="contact.html" class="active">Contact</a>
      <a href="reservation.html" class="reserve-btn">Reserve</a>
    </nav>
  </header>

  <!-- Contact Container -->
  <main class="contact-section">
    <div class="contact-card">
      <h2>Get In Touch</h2>
      <p class="contact-subtitle">Have questions or feedback? Send us a message!</p>

      <form class="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your Name" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="Your Phone Number" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Your Email" required>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Your Message..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </div>
  </main>
  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-container">
      <nav class="footer-nav">
        <a href="about.html" class="active">About Us</a>
        <a href="menu.html">Menu</a>
        <a href="gallery.html">Gallery</a>
      </nav>

      <div class="footer-logo">
        <span class="logo-icon">🌿</span>
        <span class="logo-text">Habesha Eatery</span>
      </div>

      <div class="footer-socials">
        <a href="#" class="social-btn" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="social-btn" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      </div>
    </div>

    <div class="footer-bottom">
      <p>Copyright © 2026 Habesha Eatery.</p>
      <p>Website designed by Getu.</p>
    </div>
  </footer>

</body>
</html>
